name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,linux]"

      - name: Ruff
        run: ruff check src tests

      - name: Ruff format
        run: ruff format --check src tests

      - name: Build package
        run: pip install build && python -m build

      - name: Tests
        run: pytest --cov=now_playing_apple_music --cov-report=term-missing -q

      - name: CLI help smoke
        run: now-playing-apple-music --help && musickit-sign-token --help
